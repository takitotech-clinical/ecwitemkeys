name: Edit proposal
description: Propose a change to an item key's description or category. Use the "Propose edit" button in the app; it fills this in for you.
title: 'Edit: '
labels: [edit-proposal]
body:
  - type: markdown
    attributes:
      value: |
        This proposal was prepared by the eCW Item Keys app. Please don't edit the Proposal JSON by hand — a bot checks it, and a maintainer approves it before the data changes.
  - type: input
    id: key
    attributes:
      label: Key
      description: The item key (for reference; the key inside the Proposal JSON is authoritative).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Generated by the app.
      render: json
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason / source
      description: Optional. Why is this change correct? Link a source if you have one.
    validations:
      required: false
