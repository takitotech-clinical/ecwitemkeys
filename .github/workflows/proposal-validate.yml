name: Validate proposal

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: proposal-validate-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    # The title/body test catches proposals filed while the label was missing (the form drops it).
    if: >-
      contains(github.event.issue.labels.*.name, 'edit-proposal') ||
      (startsWith(github.event.issue.title, 'Edit: ') &&
      contains(github.event.issue.body, '### Proposal'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate
        # The issue body is passed through the environment, never interpolated into the script.
        run: pnpm exec tsx scripts/proposal/validate.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
